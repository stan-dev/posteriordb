name: Check reference draws

on:
  pull_request:
    paths:
      - "posterior_database/reference_posteriors/draws/draws/*.json.zip"
      - "tests/check_reference_draws.R"
      - ".github/workflows/check_reference_draws.yml"

permissions:
  contents: read

jobs:
  reference-draws:
    name: Validate new reference draws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2

      - name: Check new draw archives
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: Rscript tests/check_reference_draws.R "$BASE_SHA" "$HEAD_SHA"
